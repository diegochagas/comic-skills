<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Restore Compare</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6d6a64; --line: #e2dfd8;
    --accent: #2f6fdf; --orig: #8a5a00; --rest: #1f7a3d; --redo: #b3261e; --alt: #6a3fb5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --text: #ecebe7; --muted: #9c998f; --line: #34332f;
      --accent: #6b9bff; --orig: #e0a53a; --rest: #5cc27f; --redo: #ff7b72; --alt: #b69cff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
    display: grid; grid-template-columns: 300px 1fr; }
  body.nolist { grid-template-columns: minmax(0, 1fr); }
  body.nolist aside { display: none; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .filters { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .filters select, .filters button { width: 100%; }
  .progress { font-size: 12px; color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  li { padding: 7px 12px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  li:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  li.active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .t { font-size: 11px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
  .dot.original { background: var(--orig); border-color: var(--orig); }
  .dot.restored { background: var(--rest); border-color: var(--rest); }
  .dot.redo { background: var(--redo); border-color: var(--redo); }
  .dot.alt, .dot[class*="alt:"] { background: var(--alt); border-color: var(--alt); }
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 200px; }
  header .issues { font-size: 12px; color: var(--muted); width: 100%; }
  .view { flex: 1; min-height: 0; padding: 12px; display: flex; gap: 12px; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pane img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  .slider { flex: 1; position: relative; min-height: 0; user-select: none; cursor: ew-resize; }
  .slider img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slider .top { clip-path: inset(0 0 0 var(--pos, 50%)); }
  .slider .handle { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; background: #fff; box-shadow: 0 0 0 1px #0006; pointer-events: none; }
  .slider .tag { position: absolute; top: 6px; font-size: 12px; background: #000a; color: #fff; padding: 2px 6px; border-radius: 3px; }
  footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.pick.sel[data-pick=original] { background: var(--orig); color: #fff; border-color: var(--orig); }
  button.pick.sel[data-pick=restored] { background: var(--rest); color: #fff; border-color: var(--rest); }
  button.pick.sel[data-pick=redo] { background: var(--redo); color: #fff; border-color: var(--redo); }
  button.pick.sel[data-pick^=alt] { background: var(--alt); color: #fff; border-color: var(--alt); }
  button.pick[hidden] { display: none; }
  select, input { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #note { flex: 1; min-width: 180px; }
  .verl { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .status { font-size: 12px; color: var(--muted); }
  kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--muted); }
  @media (max-width: 800px) {
    html, body { height: auto; }
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; overflow-x: hidden; }
    aside, main { min-width: 0; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 35vh; }
    main { min-height: 0; }
    .view { flex-direction: column; flex: none; }
    .pane { flex: none; }
    .pane img { flex: none; height: auto; max-height: 70vh; }
    .slider { flex: none; height: 60vh; }
    footer { position: sticky; bottom: 0; }
    #note { min-width: 0; flex-basis: 100%; }
  }
</style>
</head>
<body>
<aside>
  <div class="filters">
    <select id="tier"><option value="">All sets</option></select>
    <select id="state">
      <option value="">Still to review</option>
      <option value="all">All photos, finished included</option>
      <option value="done">Finished (back in the library)</option>
      <option value="none">Not picked yet</option>
      <option value="restored">Picked restored</option>
      <option value="original">Picked original</option>
      <option value="alt">Picked alternative (Higgsfield)</option>
      <option value="redo">Needs redo</option>
    </select>
    <div class="progress"><span id="count"></span><div class="bar"><div id="bar"></div></div></div>
    <button id="export">Export picks (JSON)</button>
  </div>
  <ul id="list"></ul>
</aside>
<main>
  <header>
    <button id="togglelist" title="Hide / show the photo list (L)">◀ List</button>
    <h1 id="title">Loading…</h1>
    <label class="verl">Restored version <select id="ver" title="Which restored version to show (V)"></select></label>
    <select id="mode">
      <option value="side">Side by side</option>
      <option value="slider">Slider: original | restored</option>
      <option value="slider-alt">Slider: original | alternative</option>
    </select>
    <div class="issues" id="issues"></div>
  </header>
  <div class="view" id="view"></div>
  <footer>
    <button class="pick" data-pick="original">Original <kbd>1</kbd></button>
    <button class="pick" data-pick="restored">Restored <kbd>2</kbd></button>
    <span id="altbtns"></span>
    <button class="pick" data-pick="redo">Neither / redo <kbd>3</kbd></button>
    <input id="note" placeholder="Note (optional), e.g. face changed, colours too cold">
    <button id="prev">← Prev</button>
    <button id="next">Next →</button>
    <span class="status" id="status"></span>
  </footer>
</main>
<script>
const LS_KEY = 'photo-restore-prefs';
let photos = [], prefs = {}, shown = [], cur = 0, serverOk = false;
const $ = id => document.getElementById(id);

function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
function lsSet() { try { localStorage.setItem(LS_KEY, JSON.stringify(prefs)); } catch {} }

async function save() {
  lsSet();
  if (!serverOk) { $('status').textContent = 'Saved in browser only'; return; }
  try {
    const r = await fetch('api/prefs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(prefs) });
    $('status').textContent = r.ok ? 'Saved to preferences.json' : 'Server save failed (kept in browser)';
  } catch { $('status').textContent = 'Server save failed (kept in browser)'; }
}

function applyFilters() {
  const t = $('tier').value, s = $('state').value;
  const keep = shown[cur]?.id;
  const kind = p => (prefs[p.id]?.pick || '').split(':')[0];
  const done = p => !!prefs[p.id]?.done;
  shown = photos.filter(p => (!t || p.versions.some(v => v.set === t)) &&
    (s === 'all' ? true : s === 'done' ? done(p) : !done(p) && (!s || (s === 'none' ? !kind(p) : kind(p) === s))));
  const i = shown.findIndex(p => p.id === keep);
  cur = i >= 0 ? i : 0;
  renderList(); render();
}

function renderList() {
  $('list').innerHTML = shown.map((p, i) =>
    `<li data-i="${i}" class="${i === cur ? 'active' : ''}"><span class="dot ${(prefs[p.id]?.pick || '').split(':')[0]}"></span>` +
    `<span class="n" title="${p.name}">${p.name}</span><span class="t">${p.versions.length > 1 ? p.versions.length + ' versions' : p.versions[0].set}</span></li>`).join('');
  const open = photos.filter(p => !prefs[p.id]?.done);
  const picked = open.filter(p => prefs[p.id]?.pick).length;
  $('count').textContent = `${picked} / ${open.length} picked · ${photos.length - open.length} finished`;
  $('bar').style.width = (open.length ? 100 * picked / open.length : 0) + '%';
}

function render() {
  const p = shown[cur];
  document.querySelectorAll('#list li').forEach(li => li.classList.toggle('active', +li.dataset.i === cur));
  document.querySelector('#list li.active')?.scrollIntoView({ block: 'nearest' });
  if (!p) { $('title').textContent = 'No photos match'; $('view').innerHTML = ''; $('issues').textContent = ''; return; }
  $('title').textContent = `${p.name}  (${cur + 1}/${shown.length})`;
  const vi = verIndex(p), ver = p.versions[vi];
  $('ver').innerHTML = p.versions.map((v, i) => `<option value="${i}"${i === vi ? ' selected' : ''}>${v.set}</option>`).join('');
  $('issues').textContent = p.issues || '';
  const o = p.original, r = ver.url;
  const altUrl = (p.alt || [])[0]?.url, altLabel = (p.alt || [])[0]?.label;
  if ($('mode').value.startsWith('slider')) {
    const useAlt = $('mode').value === 'slider-alt' && altUrl;
    const top = useAlt ? altUrl : r, topLabel = useAlt ? altLabel : 'Restored · ' + ver.set;
    $('view').innerHTML = `<div class="slider" id="sl"><img src="${o}" alt="original"><img class="top" src="${top}" alt="${topLabel}">` +
      `<div class="handle"></div><span class="tag" style="left:6px">Original</span><span class="tag" style="right:6px">${topLabel}</span></div>`;
    const sl = $('sl');
    const move = e => { const b = sl.getBoundingClientRect(); sl.style.setProperty('--pos', Math.min(100, Math.max(0, 100 * (e.clientX - b.left) / b.width)) + '%'); };
    sl.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') move(e); });
    sl.addEventListener('pointerdown', move);
  } else {
    $('view').innerHTML = `<div class="pane"><div class="lbl">Original</div><img src="${o}" alt="original"></div>` +
      `<div class="pane"><div class="lbl">Restored · ${ver.set}</div><img src="${r}" alt="restored"></div>` +
      (p.alt || []).map(a => `<div class="pane"><div class="lbl">${a.label}</div><img src="${a.url}" alt="${a.label}"></div>`).join('');
  }
  // one pick per alternative: "alt" is the first set (Higgsfield), "alt:<label>" the others
  $('altbtns').innerHTML = (p.alt || []).map((a, i) =>
    `<button class="pick" data-pick="${altKey(p, i)}">${a.label} <kbd>${i + 4}</kbd></button> `).join('');
  $('altbtns').querySelectorAll('.pick').forEach(b => b.onclick = () => pick(b.dataset.pick));
  const pr = prefs[p.id] || {};
  document.querySelectorAll('.pick').forEach(b => b.classList.toggle('sel',
    b.dataset.pick === 'restored' ? pr.pick === 'restored:' + ver.set : b.dataset.pick === pr.pick));
  $('note').value = pr.note || '';
}

function altKey(p, i) { return p.alt[i].label === ALT0 ? 'alt' : 'alt:' + p.alt[i].label; }
const ALT0 = 'Higgsfield';
// which restored version is shown: the one picked, else the one chosen in the menu, else the newest
const verShown = {};
function verIndex(p) {
  if (verShown[p.id] != null) return verShown[p.id];
  const pk = prefs[p.id]?.pick || '';
  const i = pk.startsWith('restored:') ? p.versions.findIndex(v => 'restored:' + v.set === pk) : -1;
  return i >= 0 ? i : 0;
}
function pick(val) {
  const p = shown[cur]; if (!p) return;
  if (val === 'restored') val = 'restored:' + p.versions[verIndex(p)].set;
  const pr = prefs[p.id] || {};
  if (pr.pick === val) delete pr.pick; else pr.pick = val;
  pr.at = new Date().toISOString();
  if (!pr.pick && !pr.note) delete prefs[p.id]; else prefs[p.id] = pr;
  save(); renderList(); render();
  if (pr.pick && $('state').value !== 'none') setTimeout(() => go(1), 150);
  if ($('state').value) applyFilters();
}

function go(d) { if (!shown.length) return; cur = (cur + d + shown.length) % shown.length; render(); }

document.querySelectorAll('.pick').forEach(b => b.onclick = () => pick(b.dataset.pick));
function toggleList(force) {
  const hide = force ?? !document.body.classList.contains('nolist');
  document.body.classList.toggle('nolist', hide);
  $('togglelist').textContent = hide ? '▶ List' : '◀ List';
  try { localStorage.setItem(LS_KEY + '-nolist', hide ? '1' : ''); } catch {}
}
$('togglelist').onclick = () => toggleList();
try { if (localStorage.getItem(LS_KEY + '-nolist')) toggleList(true); } catch {}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('list').onclick = e => { const li = e.target.closest('li'); if (li) { cur = +li.dataset.i; render(); } };
$('tier').onchange = $('state').onchange = applyFilters;
$('ver').onchange = () => { const p = shown[cur]; if (p) { verShown[p.id] = +$('ver').value; render(); } };
$('mode').onchange = () => { try { localStorage.setItem(LS_KEY + '-view', $('mode').value); } catch {} render(); };
$('note').onchange = () => {
  const p = shown[cur]; if (!p) return;
  const pr = prefs[p.id] || {};
  pr.note = $('note').value.trim(); pr.at = new Date().toISOString();
  if (!pr.pick && !pr.note) delete prefs[p.id]; else prefs[p.id] = pr;
  save();
};
$('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(prefs, null, 2)], { type: 'application/json' }));
  a.download = 'preferences.json'; a.click();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') e.target.blur(); return; }
  if (e.key === '1') pick('original');
  else if (e.key === '2') pick('restored');
  else if (e.key === '3') pick('redo');
  else if (e.key === 'l' || e.key === 'L') toggleList();
  else if (e.key === 'v' && shown[cur]) { const p = shown[cur]; verShown[p.id] = (verIndex(p) + 1) % p.versions.length; render(); }
  else if (/^[4-9]$/.test(e.key) && (shown[cur]?.alt || [])[+e.key - 4]) pick(altKey(shown[cur], +e.key - 4));
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
  else if (e.key === 's') { const order = ['side', 'slider', 'slider-alt']; $('mode').value = order[(order.indexOf($('mode').value) + 1) % order.length]; render(); }
});

(async () => {
  try { const m = localStorage.getItem(LS_KEY + '-view'); if (m && m !== 'stack') $('mode').value = m; } catch {}
  prefs = lsGet();
  try {
    photos = await (await fetch('api/photos')).json();
    const server = await (await fetch('api/prefs')).json();
    prefs = server;  // with the server running, preferences.json is the only source (the browser copy is a fallback)
    serverOk = true;
    $('status').textContent = 'Picks save to preferences.json';
  } catch {
    $('title').textContent = 'Start the server: restore-photos/scripts/compare_server.py';
    return;
  }
  [...new Set(photos.flatMap(p => p.versions.map(v => v.set)))].forEach(t => $('tier').add(new Option(t, t)));
  applyFilters();
})();
</script>
</body>
</html>
